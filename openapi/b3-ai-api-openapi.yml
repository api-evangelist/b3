openapi: 3.2.0
info:
  title: B3 AI API
  version: '1.0'
  description: 'Operations tagged Ai across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: AI
paths:
  /v1/ai/workflow/chat/history:
    get:
      description: Get chat history for a workflow or session
      parameters:
      - description: Workflow ID (for edit page)
        in: query
        name: workflowId
        schema:
          type: string
      - description: Session ID (for create page)
        in: query
        name: sessionId
        schema:
          type: string
      - description: 'Maximum number of messages to return (default: 20, max: 100)'
        in: query
        name: limit
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChatHistorySuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - AI
      summary: Get ai workflow chat history
      x-summary-source: derived
      operationId: getV1AiWorkflowChatHistory
      x-operation-id-source: derived
  /v1/ai/workflow/chat/sessions:
    get:
      description: List chat sessions for the current organization
      parameters:
      - description: 'Maximum number of sessions to return (default: 20, max: 50)'
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Offset for pagination (default: 0)'
        in: query
        name: offset
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChatSessionsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Forbidden
      tags:
      - AI
      summary: Get ai workflow chat sessions
      x-summary-source: derived
      operationId: getV1AiWorkflowChatSessions
      x-operation-id-source: derived
  /v1/ai/workflow/chat/stream:
    post:
      description: Stream AI chat for workflow generation and updates via SSE
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ChatParams'
                summary: request
                description: Chat request parameters
        description: Chat request parameters
        required: true
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: 'SSE stream with events: chunk, node, done, error'
        '400':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - AI
      summary: Create ai workflow chat stream
      x-summary-source: derived
      operationId: postV1AiWorkflowChatStream
      x-operation-id-source: derived
  /v1/organizations/{orgId}/ai-credits/usage:
    get:
      description: Get AI credit usage breakdown for a specific month
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Year-Month in YYYY-MM format
        in: query
        name: yearMonth
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAICreditUsageSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      summary: Get AI credit usage
      tags:
      - AI
      operationId: getV1OrganizationsByOrgIdAiCreditsUsage
      x-operation-id-source: derived
  /v1/ai/pulse:
    get:
      description: Get the proactive Pulse feed (situation-monitor cards + held-asset signals) for the caller's org.
      parameters:
      - description: Pass \
        in: query
        name: refresh
        schema:
          type: string
      - description: Pass \
        in: query
        name: demo
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Unauthorized
      tags:
      - AI
      summary: Get ai pulse
      x-summary-source: derived
      operationId: getV1AiPulse
      x-operation-id-source: derived
  /v1/ai/workflow/chat/debug:
    get:
      description: Get debug data for an AI chat session
      parameters:
      - description: Conversation ID (preferred, stable identifier)
        in: query
        name: conversationId
        schema:
          type: string
      - description: Workflow ID (for edit page, legacy)
        in: query
        name: workflowId
        schema:
          type: string
      - description: Session ID (for create page, legacy)
        in: query
        name: sessionId
        schema:
          type: string
      - description: 'Caddie lane to restrict to (v1, v2, v3). When omitted and grouped=false: non-admin callers default to v2 (backward compat); admin callers get the most recently updated lane, so v3-only conversations stay visible.'
        in: query
        name: agentVersion
        schema:
          type: string
      - description: 'When true, return both v2 and v3 lanes as { versions: { v2, v3 } }'
        in: query
        name: grouped
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChatDebugDataSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - AI
      summary: Get ai workflow chat debug
      x-summary-source: derived
      operationId: getV1AiWorkflowChatDebug
      x-operation-id-source: derived
    put:
      description: Save or update debug data for an AI chat session
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/SaveChatDebugDataParams'
                summary: body
                description: Debug data to save
        description: Debug data to save
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - AI
      summary: Replace ai workflow chat debug
      x-summary-source: derived
      operationId: putV1AiWorkflowChatDebug
      x-operation-id-source: derived
  /v1/ai/workflow/chat/messages:
    post:
      description: Persist one chat message (caddie records V3 turns in chat history)
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/SaveChatMessageParams'
                summary: body
                description: Message to persist
        description: Message to persist
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - AI
      summary: Create ai workflow chat messages
      x-summary-source: derived
      operationId: postV1AiWorkflowChatMessages
      x-operation-id-source: derived
  /v1/ai/workflow/chat/preflight:
    get:
      description: Check whether the org may start a caddie V3 chat turn (AI-Credit gate)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightChatResponse'
          description: OK
      tags:
      - AI
      summary: Get ai workflow chat preflight
      x-summary-source: derived
      operationId: getV1AiWorkflowChatPreflight
      x-operation-id-source: derived
  /v1/ai/workflow/chat/snapshot:
    get:
      description: 'Get the live/pending state of a conversation (refresh-resume): whether a turn is actively running, the pending interrupt card, and the current mode. Excludes the transcript (use /chat/history) and the canvas (use the workflow record).'
      parameters:
      - description: Conversation ID (stable; the V3 chat checkpoint key)
        in: query
        name: conversationId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationSnapshotSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - AI
      summary: Get ai workflow chat snapshot
      x-summary-source: derived
      operationId: getV1AiWorkflowChatSnapshot
      x-operation-id-source: derived
  /v1/ai/workflow/chat/usage:
    post:
      description: Report one chat turn's LLM usage (caddie V3) for AI-Credit billing
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ReportChatUsageParams'
                summary: body
                description: Turn usage to bill
        description: Turn usage to bill
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - AI
      summary: Create ai workflow chat usage
      x-summary-source: derived
      operationId: postV1AiWorkflowChatUsage
      x-operation-id-source: derived
components:
  schemas:
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowDefinition:
      description: 'Definition is the full workflow graph to execute. Must contain a

        "root" node with type "manual". All action nodes referenced in

        children arrays must be present.'
      properties:
        inputSchema:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowInput'
          type: array
          uniqueItems: false
        nodes:
          additionalProperties:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowNode'
          type: object
        sensitivePropKeys:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - nodes
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowNode:
      properties:
        branch:
          description: '"then" or "else", only when parent is "if" node'
          type: string
        children:
          items:
            type: string
          type: array
          uniqueItems: false
        connector:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ConnectorReference'
        description:
          description: AI-generated 1-sentence description
          type: string
        loopBody:
          description: Loop body nodes (only for for-each nodes)
          items:
            type: string
          type: array
          uniqueItems: false
        payload:
          additionalProperties: {}
          type: object
        resultSchema:
          additionalProperties: {}
          description: 'ResultSchema describes the output structure of this node (populated dynamically for x402 endpoints).

            This is used by the frontend to show available output variables in the variable picker.'
          type: object
        titleOverride:
          description: AI-generated short title (2-6 words), only when more descriptive than default
          type: string
        type:
          type: string
      required:
      - payload
      - type
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowInput:
      properties:
        description:
          type: string
        key:
          type: string
        required:
          type: boolean
        type:
          description: '"string", "number", "boolean", "object", "array"'
          type: string
      type: object
    GetChatHistorySuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ChatMessage'
          type: array
          uniqueItems: false
        message:
          example: success
          type: string
        requestId:
          type: string
      type: object
    ChatImageAttachment:
      properties:
        base64:
          type: string
        ipfsUrl:
          type: string
      type: object
    ListChatSessionsSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          $ref: '#/components/schemas/PaginatedData-schemas_ChatSession'
        message:
          example: success
          type: string
        requestId:
          example: req_abc123
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ChatMessage:
      properties:
        content:
          type: string
        createdAt:
          type: string
        id:
          type: string
        imageUrls:
          items:
            type: string
          type: array
          uniqueItems: false
        organizationId:
          type: string
        role:
          type: string
        sessionId:
          type: string
        tokensUsed:
          type: integer
        workflowId:
          type: string
      type: object
    ChatParams:
      properties:
        definition:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowDefinition'
        description:
          description: Optional - for generating new workflow
          maxLength: 500
          type: string
        failedRunId:
          description: Optional - ID of a failed run to provide error context for debugging
          maxLength: 50
          type: string
        images:
          description: Optional - images attached to the message (base64 for LLM, IPFS for storage)
          items:
            $ref: '#/components/schemas/ChatImageAttachment'
          type: array
          uniqueItems: false
        lastEventIndex:
          description: Last received event index for replay (reconnection)
          minimum: 0
          type: integer
        message:
          description: Optional on reconnect, required for new sessions
          maxLength: 10000
          type: string
        name:
          description: Optional - for generating new workflow
          maxLength: 100
          type: string
        preferredMode:
          description: Optional - user's preferred mode hint; overrides auto-classifier when set
          enum:
          - planning
          - building
          - repair
          - conversation
          type: string
        requestId:
          description: Client-generated UUID4 for persistent session tracking (optional for legacy/inline mode)
          type: string
        sessionId:
          description: Optional - for create page (temporary session context)
          type: string
        timezone:
          description: Optional - user's IANA timezone (e.g. "America/New_York") for time-aware responses
          type: string
        workflowId:
          description: Optional - for edit page (existing workflow context)
          type: string
      type: object
    PaginatedData-schemas_ChatSession:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/ChatSession'
          type: array
          uniqueItems: false
        limit:
          type: integer
        offset:
          type: integer
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse:
      properties:
        code:
          type: integer
        details:
          items: {}
          type: array
          uniqueItems: false
        message:
          type: string
        requestId:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ConnectorReference:
      description: nil if action doesn't need connector
      properties:
        id:
          description: Connector ID (or subOrgId for turnkey)
          type: string
        type:
          description: Connector type (e.g., "slack", "turnkey")
          type: string
      type: object
    ChatSession:
      properties:
        contextType:
          description: ContextType indicates whether this is a "session" or "workflow" chat
          type: string
        firstMessageAt:
          description: FirstMessageAt is when the first message was sent
          type: string
        lastMessageAt:
          description: LastMessageAt is when the last message was sent
          type: string
        messageCount:
          description: MessageCount is the total number of messages in this session
          type: integer
        preview:
          description: Preview is the content of the first user message (truncated)
          type: string
        sessionId:
          description: SessionID for create-page sessions (client-generated, e.g., session_1234567890_abc)
          type: string
        workflowId:
          description: WorkflowID for edit-page sessions (server-generated UUID)
          type: string
        workflowName:
          description: WorkflowName is the name of the associated workflow (if available)
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.AICreditUsageSummaryTotals:
      properties:
        adjusted:
          type: number
        deposited:
          type: number
        granted:
          type: number
        used:
          type: number
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.AICreditUsageSummaryPublic:
      properties:
        summary:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.AICreditUsageSummaryTotals'
        yearMonth:
          type: string
      type: object
    GetAICreditUsageSuccessResponse:
      properties:
        code:
          example: 0
          type: integer
        data:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.AICreditUsageSummaryPublic'
        message:
          example: successfully
          type: string
        requestId:
          example: req_abc123
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse:
      allOf:
      - $ref: '#/components/schemas/data'
      properties:
        code:
          type: integer
        data: {}
        message:
          type: string
        requestId:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.TemplateVisibility:
      enum:
      - org
      - public
      - org
      - public
      type: string
      x-enum-comments:
        TemplateVisibilityOrg: Only visible to organization members
        TemplateVisibilityPublic: Visible to everyone
      x-enum-varnames:
      - TemplateVisibilityOrg
      - TemplateVisibilityPublic
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ChatMessage_2:
      properties:
        agentVersion:
          type: string
        content:
          type: string
        conversationId:
          type: string
        createdAt:
          type: string
        id:
          type: string
        imageUrls:
          items:
            type: string
          type: array
          uniqueItems: false
        linkedRunFinishedAt:
          type: string
        linkedRunId:
          type: string
        linkedRunStartedAt:
          type: string
        linkedRunStatus:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.RunStatus'
        organizationId:
          type: string
        role:
          type: string
        senderUserId:
          type: string
        sessionId:
          type: string
        structuredPayload:
          items:
            type: integer
          type: array
          uniqueItems: false
        tokensUsed:
          type: integer
        turnId:
          type: string
        workflowId:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowUIMetadata:
      properties:
        comments:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.Comment'
          type: array
          uniqueItems: false
        nodePositions:
          additionalProperties:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.NodePosition'
          type: object
        stickyNotes:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.StickyNote'
          type: array
          uniqueItems: false
      type: object
    ChatParams_2:
      properties:
        agentVersion:
          description: Optional - agent version toggle; "v3" routes to the caddie service (open to every org)
          enum:
          - v1
          - v2
          - v3
          - both
          type: string
        apiKeyOverride:
          description: Optional - override the LLM API key for this request (eval/testing use only)
          maxLength: 300
          type: string
        conversationId:
          description: Stable conversation identifier (generated client-side, persists across session→workflow transition)
          maxLength: 255
          type: string
        definition:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowDefinition_2'
        description:
          description: Optional - for generating new workflow
          maxLength: 500
          type: string
        images:
          description: Optional - images attached to the message (base64 for LLM, IPFS for storage)
          items:
            $ref: '#/components/schemas/ChatImageAttachment'
          type: array
          uniqueItems: false
        lastEventIndex:
          description: Last received event index for replay (reconnection)
          minimum: 0
          type: integer
        message:
          description: Optional on reconnect, required for new sessions
          maxLength: 10000
          type: string
        modelOverride:
          description: Optional - override the LLM model for this request (eval/testing use only)
          maxLength: 200
          type: string
        name:
          description: Optional - for generating new workflow
          maxLength: 100
          type: string
        preferredMode:
          description: Optional - user's preferred mode hint; overrides auto-classifier when set
          enum:
          - planning
          - building
          - repair
          - conversation
          type: string
        requestId:
          description: Client-generated UUID4 for persistent session tracking (optional for legacy/inline mode)
          type: string
        sessionId:
          description: 'Optional - metadata: which create-page session started this conversation'
          type: string
        temperatureOverride:
          description: Optional - override the LLM temperature for this request (eval/testing use only)
          maximum: 2
          minimum: 0
          type: number
        templateSearchMode:
          description: Optional - template search mode toggle (defaults to lightweight)
          enum:
          - lightweight
          - hybrid
