openapi: 3.2.0
info:
  description: Workflow management API for B3OS
  title: B3OS Workflow MCP API
  version: '1.0'
tags:
- name: Mcp
paths:
  /v1/mcp/servers:
    get:
      description: List all known MCP servers (excluding the "custom" placeholder entry)
      parameters:
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServersCatalogSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Mcp
  /v1/mcp/{serverId}/oauth-url:
    get:
      description: Generate an OAuth authorization URL for the given MCP server
      parameters:
      - description: MCP server ID
        in: path
        name: serverId
        required: true
        schema:
          type: string
      - description: Optional connector display name
        in: query
        name: name
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpOAuthURLSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Mcp
components:
  schemas:
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse:
      properties:
        code:
          type: integer
        details:
          items: {}
          type: array
          uniqueItems: false
        message:
          type: string
        requestId:
          type: string
      type: object
    McpServersCatalogSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data: {}
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    McpOAuthURLSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          additionalProperties:
            type: string
          type: object
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
