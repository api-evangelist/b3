      x-operation-id-source: derived
  /v1/workflows/{id}/versions/{versionNumber}:
    get:
      description: Get a specific version of a workflow by version number
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Version number
        in: path
        name: versionNumber
        required: true
        schema:
          type: integer
      responses:
        '200':
