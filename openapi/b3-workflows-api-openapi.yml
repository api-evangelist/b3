      operationId: getV1WorkflowsByIdRunsCount
      x-operation-id-source: derived
  /v1/workflows/{id}/storage:
    delete:
      description: Clear all storage data for a workflow
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
