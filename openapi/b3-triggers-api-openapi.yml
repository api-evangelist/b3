info:
  title: B3 Triggers API
  version: '1.0'
  description: 'Operations tagged Triggers across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Triggers
paths:
  /v1/triggers/{type}:
    get:
      description: Get a trigger definition by type
      parameters:
      - description: Trigger type
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTriggerSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Triggers
      summary: Get triggers by type
      x-summary-source: derived
      operationId: getV1TriggersByType
      x-operation-id-source: derived
  /v1/triggers:
    get:
      description: List all available triggers, optionally filtered by tags
      parameters:
      - description: Filter by tags (comma-separated or multiple params). Triggers must have ALL specified tags (AND logic).
        in: query
        name: tags
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTriggersSuccessResponse'
          description: OK
      tags:
      - Triggers
      summary: Get triggers
      x-summary-source: derived
      operationId: getV1Triggers
      x-operation-id-source: derived
