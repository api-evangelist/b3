openapi: 3.2.0
info:
  title: B3 Metrics API
  version: '1.0'
  description: 'Operations tagged Metrics across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Metrics
paths:
  /v1/metrics/failure-rate:
    get:
      description: Get overall failure rate statistics for a time period. Maximum time range is 365 days.
      parameters:
      - description: Start timestamp (Unix milliseconds)
        in: query
        name: from
        required: true
        schema:
          type: integer
      - description: End timestamp (Unix milliseconds). Max 365 days from 'from'.
        in: query
        name: to
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFailureRateSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      tags:
      - Metrics
      summary: Get metrics failure rate
      x-summary-source: derived
      operationId: getV1MetricsFailureRate
      x-operation-id-source: derived
  /v1/metrics/recent-activity:
    get:
      description: Get recent workflow run activity
      parameters:
      - description: Number of runs to return (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Filter by status (success, failure, running)
        in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecentActivitySuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      tags:
      - Metrics
      summary: Get metrics recent activity
      x-summary-source: derived
      operationId: getV1MetricsRecentActivity
      x-operation-id-source: derived
  /v1/metrics/runs-timeseries:
    get:
      description: Get time-series data for workflow runs (total, success, failure)
      parameters:
      - description: Start timestamp (Unix milliseconds)
        in: query
        name: from
        required: true
        schema:
          type: integer
      - description: End timestamp (Unix milliseconds)
        in: query
        name: to
        required: true
        schema:
          type: integer
      - description: Granularity (hourly or daily)
        in: query
        name: granularity
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRunsTimeSeriesSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      tags:
      - Metrics
      summary: Get metrics runs timeseries
      x-summary-source: derived
      operationId: getV1MetricsRunsTimeseries
      x-operation-id-source: derived
  /v1/metrics/top-errors:
    get:
      description: Get most common errors with counts. Maximum time range is 365 days.
      parameters:
      - description: Start timestamp (Unix milliseconds)
        in: query
        name: from
        required: true
        schema:
          type: integer
      - description: End timestamp (Unix milliseconds). Max 365 days from 'from'.
        in: query
        name: to
        required: true
        schema:
          type: integer
      - description: Number of errors to return (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTopErrorsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      tags:
      - Metrics
      summary: Get metrics top errors
      x-summary-source: derived
      operationId: getV1MetricsTopErrors
      x-operation-id-source: derived
  /v1/metrics/summary:
    get:
      description: Get aggregated metrics (runs time-series, failure rate, top errors, recent activity) in a single request.
      parameters:
      - description: Start timestamp (Unix milliseconds)
        in: query
        name: from
        required: true
        schema:
          type: integer
      - description: End timestamp (Unix milliseconds)
        in: query
        name: to
        required: true
        schema:
          type: integer
      - description: Granularity (hourly or daily)
        in: query
        name: granularity
        required: true
        schema:
          type: string
      - description: Top errors limit (default 10)
        in: query
        name: topErrorsLimit
        schema:
          type: integer
      - description: Recent activity limit (default 50)
        in: query
        name: recentActivityLimit
        schema:
          type: integer
      - description: Filter recent activity by status (success, failure, running)
        in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMetricsSummarySuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      tags:
      - Metrics
      summary: Get metrics summary
      x-summary-source: derived
      operationId: getV1MetricsSummary
      x-operation-id-source: derived
