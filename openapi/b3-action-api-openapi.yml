openapi: 3.2.0
info:
  title: B3 Action API
  version: '1.0'
  description: 'Operations tagged Action across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Action
paths:
  /v1/actions/{type}/test:
    post:
      description: Test an action with custom payload
      parameters:
      - description: Action type
        in: path
        name: type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/TestActionParams'
                summary: body
                description: Test parameters
        description: Test parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestActionSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Payment Required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Gateway
      tags:
      - Action
      summary: Create actions by type test
      x-summary-source: derived
      operationId: postV1ActionsByTypeTest
      x-operation-id-source: derived
  /v1/action-proxy/{type}/execute:
    post:
      description: Execute an action (write, charges CU)
      parameters:
      - description: Action type
        in: path
        name: type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ActionProxyParams'
                summary: body
                description: Proxy parameters
        description: Proxy parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionProxySuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Payment Required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Gateway
      tags:
      - Action
      summary: Create action proxy by type execute
      x-summary-source: derived
      operationId: postV1ActionProxyByTypeExecute
      x-operation-id-source: derived
  /v1/action-proxy/{type}/query:
    post:
      description: Query an action (read-only, no CU charge)
      parameters:
      - description: Action type
        in: path
        name: type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ActionProxyQueryParams'
                summary: body
                description: Proxy parameters
        description: Proxy parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionProxySuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Payment Required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Gateway
      tags:
      - Action
      summary: Create action proxy by type query
      x-summary-source: derived
      operationId: postV1ActionProxyByTypeQuery
      x-operation-id-source: derived
  /v1/actions/{type}/run:
    post:
      description: Execute a single action immediately (no workflow definition required)
      parameters:
      - description: Action type
        in: path
        name: type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/RunActionParams'
                summary: body
                description: Run parameters
        description: Run parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunActionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Payment Required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Gateway
      tags:
      - Action
      summary: Create actions by type run
      x-summary-source: derived
      operationId: postV1ActionsByTypeRun
      x-operation-id-source: derived
components:
  schemas:
    TestActionSuccessResponse:
      properties:
        code:
          example: 0
          type: integer
        data:
          $ref: '#/components/schemas/TestActionData'
        message:
          example: successfully
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    TestActionParams:
      properties:
        connector:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ConnectorReference'
        inputs:
          additionalProperties: {}
          type: object
      required:
      - inputs
      type: object
    ActionTestError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    TestActionData:
      properties:
        actionType:
          type: string
        cuCost:
          type: number
        error:
          $ref: '#/components/schemas/ActionTestError'
        executionTimeMs:
          type: integer
        requiresGas:
          type: boolean
        result:
          additionalProperties: {}
          type: object
        success:
          type: boolean
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse:
      properties:
        code:
          type: integer
        details:
          items: {}
          type: array
          uniqueItems: false
        message:
          type: string
        requestId:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ConnectorReference:
      description: nil if action doesn't need connector
      properties:
        id:
          description: Connector ID (or subOrgId for turnkey)
          type: string
        type:
          description: Connector type (e.g., "slack", "turnkey")
          type: string
      type: object
    RunActionResponse:
      properties:
        durationMs:
          type: integer
        result:
          additionalProperties: {}
          type: object
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ConnectorReference_2:
      description: nil if action doesn't need connector
      properties:
        chainId:
          type: integer
        id:
          type: string
        type:
          type: string
        walletAddress:
          description: 'WalletAddress is the wallet''s on-chain address, only meaningful for

            type:"wallet" refs. Not used by ConnectorResolver (which resolves the

            address from the wallet DB record); exists for frontend round-trip fidelity.'
          type: string
      type: object
    TestActionData_2:
      properties:
        actionType:
          type: string
        cuCost:
          type: integer
        error:
          $ref: '#/components/schemas/ActionTestError'
        executionTimeMs:
          type: integer
        requiresGas:
          type: boolean
        result:
          additionalProperties: {}
          type: object
        success:
          type: boolean
      type: object
    ActionProxyData:
      properties:
        result:
          additionalProperties: {}
          type: object
        success:
          type: boolean
      type: object
    RunActionParams:
      properties:
        connectorId:
          type: string
        inputs:
          additionalProperties: {}
          type: object
      required:
      - inputs
      type: object
    ActionProxyQueryParams:
      properties:
        connectorId:
          type: string
        connectorType:
          type: string
        payload:
          additionalProperties: {}
          type: object
        simulate:
          type: boolean
        walletId:
          type: string
      required:
      - payload
      type: object
    ActionProxyParams:
      properties:
        connectorId:
          type: string
        connectorType:
          type: string
        payload:
          additionalProperties: {}
          type: object
        simulate:
          type: boolean
        walletId:
          type: string
      required:
      - payload
      - walletId
      type: object
    ActionProxySuccessResponse:
      properties:
        code:
          example: 0
          type: integer
        data:
          $ref: '#/components/schemas/ActionProxyData'
        message:
          example: successfully
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
