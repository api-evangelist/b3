openapi: 3.2.0
info:
  description: Workflow management API for B3OS
  title: B3OS Workflow API
  version: '1.0'
tags:
- name: workflow
paths:
  /v1/workflows/{id}/resolve:
    get:
      description: Returns the organization info for a workflow and whether the authenticated user is a member
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveWorkflowSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      summary: Resolve workflow organization
      tags:
      - workflow
components:
  schemas:
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse:
      properties:
        code:
          type: integer
        details:
          items: {}
          type: array
          uniqueItems: false
        message:
          type: string
        requestId:
          type: string
      type: object
    ResolveWorkflowResponse:
      properties:
        isMember:
          type: boolean
        organizationId:
          type: string
        organizationName:
          type: string
      type: object
    ResolveWorkflowSuccessResponse:
      properties:
        code:
          example: 0
          type: integer
        data:
          $ref: '#/components/schemas/ResolveWorkflowResponse'
        message:
          example: successfully
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
