  /insights/v1/nfts/owners/{contract_address}:
    get:
      description: Get NFT owners by contract
      summary: Get NFT owners by contract
      tags:
      - insights/nfts
      parameters:
      - $ref: '#/components/parameters/contractAddress'
      - name: chain
        in: query
        required: false
        deprecated: true
        description: Use chain_id instead
        schema:
          type: array
          example:
          - 20
          - 56
          - 1
          items:
            type: number
      - name: chain_id
