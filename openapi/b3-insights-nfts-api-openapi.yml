                        extra_metadata:
                          allOf:
                          - type: object
                            additionalProperties: {}
                          - type: object
                            properties:
                              attributes:
                                anyOf:
                                - type: array
                                  items:
                                    type: object
                                    properties:
                                      trait_type:
                                        type: string
                                      value:
                                        anyOf:
                                        - type: string
                                        - type: number
                                      display_type:
                                        type: string
                                    required:
                                    - trait_type
                                    - value
                                - type: object
                                  additionalProperties: {}
                              properties:
                                type: object
                                additionalProperties: {}
                        collection:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: string
                            image_url:
                              type: string
                            banner_image_url:
                              type: string
                            featured_image_url:
                              type: string
                            external_link:
                              type: string
                        contract:
                          type: object
                          properties:
                            chain_id:
                              type: number
                              description: The chain ID of a relevant entry
                              example: 1
                            address:
                              type: string
                              title: address (hex or ENS)
                              example: vitalik.eth
                            name:
                              type: string
                            symbol:
                              type: string
                            type:
                              type: string
                              enum:
                              - erc721
                              - erc1155
