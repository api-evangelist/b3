components:
  parameters:
    transactionHash:
      schema:
        type: string
      required: true
      name: transaction_hash
      in: path
    page:
      schema:
        type:
        - integer
        - 'null'
        minimum: 0
        default: 0
        description: 'Page number (0-indexed). Maximum value depends on query parameters: 20 for regular queries, 500 when using aggregate or group_by parameters.'
        example: 0
      required: false
      name: page
      in: query
    contractAddress:
      schema:
        type: string
        title: address (hex or ENS)
        example: vitalik.eth
      required: true
      name: contract_address
      in: path
    blockTimestampTo:
      schema:
        type: integer
        description: Filter by block timestamp less than or equal to
        example: 1749768884
        exclusiveMinimum: 0
      required: false
      name: block_timestamp_to
      in: query
    ownerAddress:
      schema:
        type: string
        title: address (hex or ENS)
        example: vitalik.eth
      required: true
      name: ownerAddress
      in: path
    blockTimestampFrom:
      schema:
        type: integer
        description: Filter by block timestamp greater than or equal to
        example: 1749768884
        exclusiveMinimum: 0
      required: false
      name: block_timestamp_from
      in: query
    tokenId:
      schema:
        type: string
      required: true
      name: token_id
      in: path
    limit:
      schema:
        type: integer
        maximum: 1000
        default: 20
        description: The number of items to return
        example: 20
        exclusiveMinimum: 0
      required: false
      name: limit
      in: query
    blockNumberFrom:
      schema:
        anyOf:
        - type: number
          title: number
        - type: string
          pattern: ^\d+$
          title: string
        description: Filter by block number greater than or equal to
        example: '1000000'
      required: false
      name: block_number_from
      in: query
  securitySchemes:
    clientId:
      type: apiKey
      in: header
      name: x-client-id
      description: thirdweb client ID in headers
    secretKey:
      type: apiKey
      in: header
      name: x-secret-key
      description: thirdweb secret key in headers
    dashboard:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: thirdweb JWT + Client ID
    clientId-query:
      type: apiKey
      in: query
      name: clientId
      description: thirdweb client ID in query params
