  /insights/v1/nfts/transfers:
    get:
      description: Get NFT transfers
      summary: Get NFT transfers
      tags:
      - insights/nfts
      parameters:
      - name: chain
        in: query
        required: false
        deprecated: true
        description: Use chain_id instead
        schema:
          type: array
          example:
          - 20
          - 56
          - 1
          items:
            type: number
      - name: chain_id
        in: query
        required: false
        description: The chain ID(s) to request the data for. You can specify multiple chain IDs, up to a maximum of 55. Use repeated query parameters, e.g., `?chain_id=20&chain_id=56`. Optional, because a single chain can as well be specified as a subdomain
        schema:
          type: array
          example:
          - 20
          - 56
          - 1
          items:
            type: number
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/page'
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
          description: Whether to include metadata for the tokens
          example: 'false'
        required: false
        name: metadata
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
          description: Whether to include owner addresses in the NFT metadata (only if metadata is requested)
          example: 'false'
        required: false
        name: include_owners
        in: query
      - $ref: '#/components/parameters/blockNumberFrom'
      - $ref: '#/components/parameters/blockTimestampFrom'
      - $ref: '#/components/parameters/blockTimestampTo'
      - $ref: '#/components/parameters/ownerAddress'
      - $ref: '#/components/parameters/contractAddress'
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Sort order (asc or desc)
          example: desc
        required: false
        name: sort_order
        in: query
      - schema:
          type: string
          enum:
          - mint
          - transfer
          - burn
          - sale
          description: Only include transfers of a certain type
          example: mint
        required: false
        name: transfer_type
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
          description: Whether to include sale details for NFT transfers
          example: 'false'
        required: false
        name: sales
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'true'
          description: Whether to resolve metadata IPFS or Arweave links
          example: 'false'
        required: false
        name: resolve_metadata_links
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        token_id:
                          type: string
                        chain_id:
                          type: number
                        block_number:
                          type: string
                        block_hash:
                          type: string
                        block_timestamp:
                          type: string
                        transaction_hash:
                          type: string
                        from_address:
                          type: string
                        to_address:
                          type: string
                        log_index:
                          type: number
                        contract_address:
                          type: string
                        transfer_type:
                          type: string
                          enum:
                          - mint
                          - sale
                          - transfer
                        token_type:
                          type: string
                          enum:
                          - erc721
                          - erc1155
                        amount:
                          type: string
                        nft_metadata:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: string
                            image_url:
                              type: string
                            video_url:
                              type: string
                            animation_url:
                              type: string
                            background_color:
                              type: string
                            external_url:
                              type: string
                            status:
                              type: string
                            metadata_url:
                              type: string
                            owner_addresses:
                              type: array
                              items:
                                type: string
                            extra_metadata:
                              allOf:
                              - type: object
                                additionalProperties: {}
                              - type: object
                                properties:
                                  attributes:
                                    anyOf:
                                    - type: array
                                      items:
                                        type: object
                                        properties:
                                          trait_type:
                                            type: string
                                          value:
                                            anyOf:
                                            - type: string
                                            - type: number
                                          display_type:
                                            type: string
                                        required:
                                        - trait_type
                                        - value
                                    - type: object
                                      additionalProperties: {}
                                  properties:
                                    type: object
                                    additionalProperties: {}
                            collection:
                              type: object
                              properties:
                                name:
                                  type: string
                                description:
                                  type: string
                                image_url:
                                  type: string
                                banner_image_url:
                                  type: string
                                featured_image_url:
                                  type: string
                                external_link:
                                  type: string
                            contract:
                              type: object
                              properties:
                                chain_id:
                                  type: number
                                  description: The chain ID of a relevant entry
                                  example: 1
                                address:
                                  type: string
                                  title: address (hex or ENS)
                                  example: vitalik.eth
                                name:
                                  type: string
                                symbol:
                                  type: string
                                type:
                                  type: string
                                  enum:
                                  - erc721
                                  - erc1155
                              required:
                              - chain_id
                              - address
                        nft_sale:
                          type: object
                          properties:
                            transaction_hash:
                              type: string
                            items_sold:
                              type: array
                              items:
                                type: object
                                properties:
                                  token_address:
                                    type: string
                                    title: address (hex or ENS)
                                    example: vitalik.eth
                                  token_id:
                                    type: string
                                  amount:
                                    type: string
                                  token_type:
                                    type: string
                                  from_address:
                                    type: string
                                    title: address (hex or ENS)
                                    example: vitalik.eth
                                  to_address:
                                    type: string
                                    title: address (hex or ENS)
                                    example: vitalik.eth
                                required:
                                - token_address
                                - token_id
                                - amount
                                - token_type
                            payment:
                              type: array
                              items:
                                type: object
                                properties:
                                  token_address:
                                    type: string
                                    title: address (hex or ENS)
                                    example: vitalik.eth
                                  token_id:
                                    type: string
                                  amount:
                                    type: string
                                  token_type:
                                    type: string
                                  from_address:
                                    type: string
                                    title: address (hex or ENS)
                                    example: vitalik.eth
                                  to_address:
                                    type: string
                                    title: address (hex or ENS)
                                    example: vitalik.eth
                                required:
                                - token_address
                                - token_id
                                - amount
                                - token_type
                            marketplace_address:
                              type: string
                            marketplace_name:
                              type: string
                          required:
                          - transaction_hash
                          - items_sold
                          - payment
                          - marketplace_address
                          - marketplace_name
                      required:
                      - token_id
                      - chain_id
                      - block_number
                      - block_timestamp
                      - transaction_hash
                      - from_address
                      - to_address
                      - log_index
                      - contract_address
                      - transfer_type
                      - token_type
                      - amount
                required:
                - data
        '404':
          description: Not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /insights/v1/nfts/transfers/transaction/{transaction_hash}:
    get:
      description: Get NFT transfers by transaction
      summary: Get NFT transfers by transaction
      tags:
      - insights/nfts
