    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_types.StorkLatestPricesResponse:
      properties:
        prices:
          additionalProperties:
            type: string
          description: '{"BTCUSD": "103594.842425999988"}'
          type: object
