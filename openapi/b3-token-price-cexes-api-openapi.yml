openapi: 3.2.0
info:
  title: B3 Token Price Cexes API
  version: '1.0'
  description: 'Operations tagged Token Price Cexes across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Token Price Cexes
paths:
  /v1/token-price-cexes/available-assets:
    get:
      description: Get available assets for token price (CEXes)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableAssetsTokenPriceCexesSuccessResponse'
          description: OK
      tags:
      - Token Price Cexes
      summary: Get token price cexes available assets
      x-summary-source: derived
      operationId: getV1TokenPriceCexesAvailableAssets
      x-operation-id-source: derived
  /v1/token-price-cexes/latest:
    get:
      description: Get latest prices for specified assets
      parameters:
      - description: Comma-separated list of assets
        in: query
        name: assets
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestPricesTokenPriceCexesSuccessResponse'
          description: OK
      tags:
      - Token Price Cexes
      summary: Get token price cexes latest
      x-summary-source: derived
      operationId: getV1TokenPriceCexesLatest
      x-operation-id-source: derived
components:
