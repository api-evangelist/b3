openapi: 3.2.0
info:
  description: Workflow management API for B3OS
  title: B3OS Workflow Mcp Connectors API
  version: '1.0'
tags:
- name: Mcp Connectors
paths:
  /v1/mcp-connectors:
    get:
      description: List all MCP connectors for the caller's org (token-free view)
      parameters:
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpListConnectorsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Mcp Connectors
components:
  schemas:
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse:
      properties:
        code:
          type: integer
        details:
          items: {}
          type: array
          uniqueItems: false
        message:
          type: string
        requestId:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_service_mcp.McpConnectorView:
      properties:
        displayName:
          type: string
        id:
          type: string
        serverId:
          type: string
        serverUrl:
          type: string
        transport:
          type: string
      type: object
    PaginatedData-github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_service_mcp_McpConnectorView:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_service_mcp.McpConnectorView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        offset:
          type: integer
      type: object
    McpListConnectorsSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          $ref: '#/components/schemas/PaginatedData-github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_service_mcp_McpConnectorView'
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
