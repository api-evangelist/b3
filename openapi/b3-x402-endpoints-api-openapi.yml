openapi: 3.1.0
info:
  description: Workflow management API for B3OS
  title: B3OS Workflow Action X402 Endpoints API
  version: '1.0'
tags:
- name: X402 Endpoints
paths:
  /v1/x402-endpoints:
    get:
      description: List all public x402 endpoints
      parameters:
      - description: Filter by category
        in: query
        name: category
        schema:
          type: string
      - description: Search in name and description
        in: query
        name: search
        schema:
          type: string
      - description: Limit (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination
        in: query
        name: offset
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListX402EndpointsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - X402 Endpoints
    post:
      description: Create (import) a new x402 endpoint after successful test
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/CreateX402EndpointParams'
                summary: request
                description: Endpoint details
        description: Endpoint details
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateX402EndpointSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/by-url:
    get:
      description: Check if an x402 endpoint exists by URL
      parameters:
      - description: Resource URL to check
        in: query
        name: url
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckX402EndpointSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/execute:
    post:
      description: Execute an x402 call with a pre-signed payment header (proxy mode)
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ExecuteX402EndpointParams'
                summary: request
                description: Execute parameters
        description: Execute parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteX402EndpointSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Unauthorized
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/generate-metadata:
    post:
      description: Generate AI metadata (name, description, category, tags) for an x402 endpoint
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/GenerateX402MetadataParams'
                summary: request
                description: Endpoint details for metadata generation
        description: Endpoint details for metadata generation
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateX402MetadataSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/import:
    post:
      description: Import an x402 endpoint atomically (probe + pay + generate metadata + create)
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ImportX402EndpointParams'
                summary: request
                description: Import parameters
        description: Import parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportX402EndpointSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Conflict
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/probe:
    post:
      description: Probe an x402 endpoint to get its payment requirements
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ProbeX402EndpointParams'
                summary: request
                description: Endpoint URL to probe
        description: Endpoint URL to probe
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeX402EndpointSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/test:
    post:
      description: Test an x402 endpoint using the organization's default Turnkey wallet
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/TestX402EndpointParams'
                summary: request
                description: Test parameters
        description: Test parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestX402EndpointSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Unauthorized
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/{id}:
    get:
      description: Get an x402 endpoint by ID
      parameters:
      - description: Endpoint ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetX402EndpointSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - X402 Endpoints
  /v1/x402-endpoints/{id}/verify:
    post:
      description: Re-verify an x402 endpoint and update its schemas
      parameters:
      - description: Endpoint ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/VerifyX402EndpointParams'
                summary: request
                description: New schemas from re-test
        description: New schemas from re-test
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyX402EndpointSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - X402 Endpoints
components:
  schemas:
    ExecuteX402EndpointParams:
      properties:
        body:
          additionalProperties: {}
          type: object
        method:
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          type: string
        paymentHeader:
          description: Base64-encoded X-PAYMENT from browser signing
          type: string
        resourceUrl:
          type: string
      required:
      - paymentHeader
      - resourceUrl
      type: object
    GenerateX402MetadataSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          $ref: '#/components/schemas/GenerateX402MetadataData'
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    CheckX402EndpointSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          $ref: '#/components/schemas/CheckX402EndpointData'
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ParamDefinition:
      properties:
        default:
          description: Default value (used if not provided at runtime)
        description:
          description: Human-readable description
          type: string
        enum:
          description: Validation hints (optional)
          items: {}
          type: array
          uniqueItems: false
        items:
          additionalProperties: {}
          description: For complex types
          type: object
        maxLength:
          description: Max length for strings
          type: integer
        maximum:
          description: Maximum for numbers
          type: integer
        minLength:
          description: Min length for strings
          type: integer
        minimum:
          description: Minimum for numbers
          type: integer
        pattern:
          description: Regex pattern for strings
          type: string
        properties:
          additionalProperties: {}
          description: Object properties
          type: object
        required:
          description: Whether this param is required
          type: boolean
        type:
          description: string, number, integer, boolean, array, object
          type: string
      type: object
    GenerateX402MetadataData:
      properties:
        category:
          type: string
        description:
          type: string
        name:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    PaginatedData-github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity_X402Endpoint:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.X402Endpoint'
          type: array
          uniqueItems: false
        limit:
          type: integer
        offset:
          type: integer
      type: object
    TestX402EndpointParams:
      properties:
        body:
          additionalProperties: {}
          type: object
        method:
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          type: string
        resourceUrl:
          type: string
      required:
      - resourceUrl
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.X402Endpoint:
      properties:
        avgResponseMs:
          type: integer
        baseUrl:
          description: '=== ENDPOINT IDENTITY ===

            BaseURL is the clean URL without query params (e.g., "https://api.example.com/search")'
          type: string
        bodyParams:
          additionalProperties:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ParamDefinition'
          type: object
        category:
          type: string
        createdAt:
          description: === TIMESTAMPS ===
          type: string
        defaultBody:
          additionalProperties: {}
          type: object
        defaultHeaders:
          additionalProperties: {}
          type: object
        defaultQueryParams:
          additionalProperties: {}
          description: Default values (applied if user doesn't provide at runtime)
          type: object
        description:
          type: string
        exampleBody: {}
        exampleOutput: {}
        exampleQueryParams:
          additionalProperties: {}
          description: === EXAMPLES ===
          type: object
        failureCount:
          type: integer
        headerParams:
          additionalProperties:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ParamDefinition'
          type: object
        id:
          type: string
        inputSummary:
          type: string
        lastCalledAt:
          type: string
        lastError:
          type: string
        lastErrorAt:
          type: string
        maxAllowedPrice:
          description: Price protection (auto 5x of import price)
          type: string
        method:
          description: GET, POST, PUT, DELETE
          type: string
        mimeType:
          type: string
        name:
          description: === METADATA ===
          type: string
        network:
          type: string
        outputSchema:
          additionalProperties: {}
          description: === OUTPUT ===
          type: object
        outputSummary:
          type: string
        payTo:
          type: string
        price:
