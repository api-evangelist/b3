openapi: 3.2.0
info:
  title: B3 Api Keys API
  version: '1.0'
  description: 'Operations tagged Api Keys across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: API Keys
paths:
  /v1/api-keys:
    get:
      description: List all API keys for the current organization
      parameters:
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAPIKeysSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - API Keys
      summary: Get api keys
      x-summary-source: derived
      operationId: getV1ApiKeys
      x-operation-id-source: derived
    post:
      description: Create a new API key for the current organization
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/CreateAPIKeyParams'
                summary: request
                description: API key details
        description: API key details
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeySuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - API Keys
      summary: Create api keys
      x-summary-source: derived
      operationId: postV1ApiKeys
      x-operation-id-source: derived
  /v1/api-keys/{id}:
    delete:
      description: Revoke an API key by ID
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAPIKeySuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - API Keys
      summary: Delete api keys by id
      x-summary-source: derived
      operationId: deleteV1ApiKeysById
      x-operation-id-source: derived
    get:
      description: Get a single API key by ID
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAPIKeySuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - API Keys
      summary: Get api keys by id
      x-summary-source: derived
      operationId: getV1ApiKeysById
      x-operation-id-source: derived
  /v1/api-keys/requests:
    get:
      description: List recent API request audit logs for the current organization
      parameters:
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      - description: Filter by service account ID
        in: query
        name: serviceAccountId
        schema:
          type: string
      - description: Filter by API key ID
        in: query
        name: apiKeyId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAPIRequestAuditsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - API Keys
      summary: Get api keys requests
      x-summary-source: derived
      operationId: getV1ApiKeysRequests
      x-operation-id-source: derived
