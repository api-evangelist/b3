openapi: 3.2.0
info:
  title: B3 Integrations API
  version: '1.0'
  description: 'Operations tagged Integrations across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Integrations
paths:
  /v1/integrations/telegram-b3os-bot:
    post:
      description: Handle B3OS Telegram bot webhook update
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - additionalProperties: {}
                title: body
                type: object
        description: Telegram update payload
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_service_integration.IntegrationResult'
          description: OK
        '403':
          description: Forbidden
      tags:
      - Integrations
      summary: Create integrations telegram b3os bot
      x-summary-source: derived
      operationId: postV1IntegrationsTelegramB3osBot
      x-operation-id-source: derived
  /v1/integrations/slack/events:
    post:
      description: Handle Slack Events API webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      tags:
      - Integrations
      summary: Create integrations slack events
      x-summary-source: derived
      operationId: postV1IntegrationsSlackEvents
      x-operation-id-source: derived
  /v1/integrations/slack/interactivity:
    post:
      description: Handle Slack interaction webhook
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      tags:
      - Integrations
      summary: Create integrations slack interactivity
      x-summary-source: derived
      operationId: postV1IntegrationsSlackInteractivity
      x-operation-id-source: derived
  /v1/integrations/slack/oauth-callback:
    get:
      description: Handles Slack OAuth redirect
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        schema:
          type: string
      - description: CSRF state token
        in: query
        name: state
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Slack OAuth callback
      tags:
      - Integrations
      operationId: getV1IntegrationsSlackOauthCallback
      x-operation-id-source: derived
  /v1/integrations/slack/oauth-url:
    get:
      description: Generates a Slack authorization URL
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        '500':
          description: Internal Server Error
      summary: Get Slack OAuth URL
      tags:
      - Integrations
      operationId: getV1IntegrationsSlackOauthUrl
      x-operation-id-source: derived
components:
  schemas:
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_service_integration.IntegrationResult:
      properties:
        action:
          description: '"triggered", "resumed", "skipped"'
          type: string
        eventId:
          description: Webhook event ID for audit
          type: string
        reason:
          description: If skipped, the reason
          type: string
        runIds:
          description: Multiple if fan-out (platform) or single (generic)
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
