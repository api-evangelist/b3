          type: string
        createdAt:
          type: integer
        id:
          type: string
        isDefault:
          type: boolean
        isImported:
          type: boolean
        name:
          type: string
        organizationId:
          type: string
        providerType:
          type: string
        providerWalletId:
          type: string
        turnkeyRootUserId:
          description: 'TurnkeyRootUserId is an internal Turnkey infrastructure ID.

            Only populated for the import-wallet flow; do not rely on it in other consumers.'
          type: string
        turnkeySubOrgId:
          type: string
        updatedAt:
          type: integer
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.OrganizationWallet_2:
      properties:
        accountType:
          type: string
        address:
          type: string
        createdAt:
          type: string
        deletedAt:
          type: string
        deletedBy:
