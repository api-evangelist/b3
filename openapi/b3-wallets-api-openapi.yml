          type: string
        deletedBy:
          type: string
        id:
          type: string
        isDefault:
          type: boolean
        name:
          type: string
        organizationId:
          type: string
        turnkeyWalletId:
          type: string
        updatedAt:
          type: string
      type: object
    WithdrawWalletResponse:
      properties:
        blockNumber:
          type: integer
        transactionHash:
          type: string
      type: object
    ListWalletsSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          $ref: '#/components/schemas/PaginatedData-schemas_WalletResponse'
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse:
      properties:
        code:
          type: integer
        details:
          items: {}
          type: array
          uniqueItems: false
