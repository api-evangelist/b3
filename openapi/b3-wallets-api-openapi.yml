      type: object
    WalletAccountParams:
      properties:
        addressFormat:
          enum:
          - ADDRESS_FORMAT_ETHEREUM
          - ADDRESS_FORMAT_SOLANA
          type: string
        curve:
          enum:
          - CURVE_SECP256K1
          - CURVE_ED25519
          type: string
        path:
          type: string
        pathFormat:
          enum:
          - PATH_FORMAT_BIP32
          type: string
      required:
      - addressFormat
      - curve
      - path
      - pathFormat
