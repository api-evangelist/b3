      summary: Create organizations by org id wallets polymarket deposit
      x-summary-source: derived
      operationId: postV1OrganizationsByOrgIdWalletsPolymarketDeposit
      x-operation-id-source: derived
components:
  schemas:
    PaginatedData-schemas_WalletResponse:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/WalletResponse'
          type: array
          uniqueItems: false
        limit:
          type: integer
        offset:
          type: integer
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_service_wallet.ArchiveWalletResponse:
      properties:
        archivedWorkflowIds:
          items:
            type: string
          type: array
          uniqueItems: false
        message:
          type: string
      type: object
    CreateWalletParams:
      properties:
        name:
          maxLength: 100
          type: string
      required:
      - name
      type: object
    WithdrawWalletParams:
      properties:
        amount:
          type: string
        chainId:
          minimum: 1
          type: integer
        recipientAddress:
          type: string
        tokenAddress:
          type: string
      required:
      - amount
      - chainId
      - recipientAddress
      - tokenAddress
      type: object
    WalletResponse:
      properties:
        address:
