openapi: 3.2.0
info:
  title: B3 Public API
  version: '1.0'
  description: 'Operations tagged Public across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Public
paths:
  /v1/public/runs/by-tx/{txHash}:
    get:
      description: Find a run by trigger transaction hash (no auth required)
      parameters:
      - description: Transaction Hash
        in: path
        name: txHash
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicRunByTxSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Public
      summary: Get public runs by tx by tx hash
      x-summary-source: derived
      operationId: getV1PublicRunsByTxByTxHash
      x-operation-id-source: derived
  /v1/public/workflows/{id}/meta:
    get:
      description: 'Get public metadata (name, description) for a workflow.

        No auth required — intentionally unauthenticated for OG image generation.

        Only returns title and description; no sensitive data is exposed.'
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicMetaSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Public
      summary: Get public workflows by id meta
      x-summary-source: derived
      operationId: getV1PublicWorkflowsByIdMeta
      x-operation-id-source: derived
  /v1/public/workflows/{id}/widget:
    get:
      description: Get public widget configuration for a workflow (no auth required)
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicWidgetSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Public
      summary: Get public workflows by id widget
      x-summary-source: derived
      operationId: getV1PublicWorkflowsByIdWidget
      x-operation-id-source: derived
  /v1/public/contact:
    post:
      description: 'Submit the public contact form. Delivers an email to the

        configured recipient via the central B3 Notifications API. No

        auth; IP-rate-limited (see configs.contact.rate_limit_per_hour).'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/SubmitContactFormRequest'
                summary: body
                description: Contact form payload
        description: Contact form payload
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitContactFormSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Too Many Requests
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Service Unavailable
      tags:
      - Public
      summary: Create public contact
      x-summary-source: derived
      operationId: postV1PublicContact
      x-operation-id-source: derived
  /v1/public/executions/{id}:
    get:
      description: Get the current status and event timeline for a public execution
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Client token returned when the execution was created
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicExecutionSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Unauthorized
      tags:
      - Public
      summary: Get public executions by id
      x-summary-source: derived
      operationId: getV1PublicExecutionsById
      x-operation-id-source: derived
  /v1/public/runs/{id}:
    get:
      description: Get a public run by ID
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicRunSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Public
      summary: Get public runs by id
      x-summary-source: derived
      operationId: getV1PublicRunsById
      x-operation-id-source: derived
  /v1/public/workflows/{id}:
    get:
      description: Get a public workflow by visibility
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Workflow version
        in: query
        name: v
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicWorkflowSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Public
      summary: Get public workflows by id
      x-summary-source: derived
      operationId: getV1PublicWorkflowsById
      x-operation-id-source: derived
  /v1/public/workflows/{id}/executions:
    post:
      description: Create a client-trackable execution session for a public_execute workflow
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/CreatePublicExecutionParams'
                summary: body
                description: Execution metadata
        description: Execution metadata
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExecutionSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Too Many Requests
      tags:
      - Public
      summary: Create public workflows by id executions
      x-summary-source: derived
      operationId: postV1PublicWorkflowsByIdExecutions
      x-operation-id-source: derived
  /v1/public/workflows/{id}/run:
    post:
      description: Trigger a run for a public_execute workflow
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - additionalProperties: {}
                title: body
                type: object
        description: Trigger payload
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Public
      summary: Create public workflows by id run
      x-summary-source: derived
      operationId: postV1PublicWorkflowsByIdRun
      x-operation-id-source: derived
  /v1/public/workflows/{id}/runs:
    get:
      description: List runs for a public workflow
      parameters:
      - description: Workflow ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPublicRunsSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Public
      summary: Get public workflows by id runs
      x-summary-source: derived
      operationId: getV1PublicWorkflowsByIdRuns
      x-operation-id-source: derived
components:
  schemas:
    PublicNodeState:
      properties:
        finishedAt:
          description: When execution finished
          type: string
        startedAt:
          description: When execution started
          type: string
        status:
          description: '"pending", "running", "success", "failure", "skipped"'
          type: string
        type:
          description: Node type (e.g., "erc20-receive", "send-slack-message")
          type: string
      type: object
    GetPublicWidgetResponse:
      properties:
        widget:
          $ref: '#/components/schemas/PublicWidgetData'
        workflowId:
          description: WorkflowID is the workflow identifier
          type: string
        workflowName:
          description: WorkflowName is the display name of the workflow
          type: string
      type: object
    GetPublicWidgetSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          $ref: '#/components/schemas/GetPublicWidgetResponse'
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    PublicWorkflowNode:
      properties:
        children:
          description: Child node IDs
          items:
            type: string
          type: array
          uniqueItems: false
        loopBody:
          description: Loop body node IDs (for-each only)
          items:
            type: string
          type: array
          uniqueItems: false
        type:
          description: Node type
          type: string
      type: object
    GetPublicRunByTxResponse:
      properties:
        executionState:
          additionalProperties:
            $ref: '#/components/schemas/PublicNodeState'
          description: Current state of each node
          type: object
        finishedAt:
          type: string
        nodes:
          additionalProperties:
            $ref: '#/components/schemas/PublicWorkflowNode'
          description: Step-by-step execution data
          type: object
        runId:
          type: string
        startedAt:
          type: string
        status:
          description: '"running", "success", "failure"'
          type: string
        workflowId:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse:
      properties:
        code:
          type: integer
        details:
          items: {}
          type: array
          uniqueItems: false
        message:
          type: string
        requestId:
          type: string
      type: object
    GetPublicRunByTxSuccessResponse:
      properties:
        code:
          example: 0
          type: integer
        data:
          $ref: '#/components/schemas/GetPublicRunByTxResponse'
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    PublicWidgetData:
      description: Widget contains the public widget configuration with derived trigger values
      properties:
        buttonLabel:
          description: ButtonLabel is the text displayed on the trigger button
          type: string
        chainId:
          description: ChainID is derived from the trigger's chainId
          type: integer
        description:
          description: Description explains what the workflow does
          type: string
        enabled:
          description: Enabled controls whether the public widget is active
          type: boolean
        maxAmount:
          description: MaxAmount is the maximum amount allowed per trigger (in smallest unit)
          type: string
        minAmount:
          description: MinAmount is the minimum amount required to trigger (in smallest unit)
          type: string
        recipientAddress:
          description: RecipientAddress is derived from the trigger's toAddress/contractAddress
          type: string
        title:
          description: Title is the display title for the widget
          type: string
        tokenAddress:
          description: TokenAddress is derived from the trigger's tokenAddress (empty for native token)
          type: string
      type: object
    GetPublicMetaSuccessResponse:
      properties:
        code:
          example: 200
          type: integer
        data:
          $ref: '#/components/schemas/GetPublicMetaResponse'
        message:
          example: success
          type: string
        requestId:
          example: abc-123
          type: string
      type: object
    GetPublicMetaResponse:
      properties:
        description:
          description: Description is a short summary of what the workflow does.
          type: string
        name:
          description: Name is the display name of the workflow.
          type: string
        workflowId:
          description: WorkflowID is the workflow identifier.
          type: string
      type: object
    SubmitContactFormRequest:
      properties:
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        message:
          type: string
        phone:
          type: string
      required:
      - email
      - firstName
      - lastName
      - message
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse:
      allOf:
      - $ref: '#/components/schemas/data'
      properties:
        code:
          type: integer
        data: {}
        message:
          type: string
        requestId:
          type: string
      type: object
    SubmitContactFormSuccessResponse:
      properties:
        code:
          type: integer
        data:
          $ref: '#/components/schemas/SubmitContactFormResponse'
        message:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.TemplateVisibility:
      enum:
      - org
      - public
      - org
      - public
      type: string
      x-enum-comments:
        TemplateVisibilityOrg: Only visible to organization members
        TemplateVisibilityPublic: Visible to everyone
      x-enum-varnames:
      - TemplateVisibilityOrg
      - TemplateVisibilityPublic
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowUIMetadata:
      properties:
        comments:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.Comment'
          type: array
          uniqueItems: false
        nodePositions:
          additionalProperties:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.NodePosition'
          type: object
        stickyNotes:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.StickyNote'
          type: array
          uniqueItems: false
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.BlockExpansionMeta:
      properties:
        blockId:
          type: string
        blockVersion:
          type: integer
        entryNodeIds:
          description: Subset of ExpandedIDs that are entry points
          items:
            type: string
          type: array
          uniqueItems: false
        expandedIds:
          description: All namespaced node IDs produced by expansion
          items:
            type: string
          type: array
          uniqueItems: false
        outputSchema:
          description: Block's output schema for reference
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.BlockOutput'
          type: array
          uniqueItems: false
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowVisibility:
      enum:
      - private
      - org
      - public_view
      - public_execute
      type: string
      x-enum-varnames:
      - WorkflowVisibilityPrivate
      - WorkflowVisibilityOrg
      - WorkflowVisibilityPublicView
      - WorkflowVisibilityPublicExecute
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.Template:
      properties:
        archived:
          type: boolean
        category:
          description: 'Deprecated: Use Tags instead'
          type: string
        cooldownMs:
          type: integer
        createdAt:
          type: string
        createdBy:
          type: string
        definition:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowDefinition'
        description:
          type: string
        forkCount:
          type: integer
        generatedAppId:
          description: 'Generated-app attachment (nil when the template ships no app). On

            adoption the referenced app is CLONED into the adopting org''s new

            workflow. GeneratedAppVersionID optionally pins a specific version

            whose manifest is used as the clone source.'
          type: string
        generatedAppVersionId:
          type: string
        id:
          type: string
        isPromoted:
          type: boolean
        maxRuns:
          type: integer
        moderationStatus:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.TemplateModerationStatus'
        name:
          type: string
        organizationDescription:
          type: string
        organizationId:
          description: Fields for user-generated templates (nil for built-in templates)
          type: string
        organizationName:
          type: string
        organizationPhoto:
          type: string
        promotedAt:
          type: string
        promotedBy:
          type: string
        promotedOrder:
          type: integer
        rejectionReason:
          type: string
        reviewedAt:
          type: string
        reviewedBy:
          type: string
        slug:
          type: string
        sourceWorkflowId:
          description: Source workflow link (nil for built-in or legacy templates)
          type: string
        submittedAt:
          type: string
        tableSchemas:
          additionalProperties:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.TableSchema'
          type: object
        tags:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.Tag'
          type: array
          uniqueItems: false
        templateProps:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.TemplateProp'
          type: array
          uniqueItems: false
        uiMetadata:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.WorkflowUIMetadata'
        updatedAt:
          type: string
        updatedBy:
          type: string
        version:
          type: integer
        visibility:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.TemplateVisibility'
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.StickyNoteSize:
      properties:
        height:
          type: number
        width:
          type: number
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.VariableType:
      enum:
      - number
      - text
      - boolean
      - list
      - object
      type: string
      x-enum-varnames:
      - VariableTypeNumber
      - VariableTypeText
      - VariableTypeBoolean
      - VariableTypeList
      - VariableTypeObject
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.StickyNoteUser:
      properties:
        clientId:
          type: string
        name:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.TableSchema:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ColumnSchema'
          type: array
          uniqueItems: false
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.ConnectorReference:
      description: nil if action doesn't need connector
      properties:
        chainId:
          type: integer
        id:
          type: string
        type:
          type: string
        walletAddress:
          description: 'WalletAddress is the wallet''s on-chain address, only meaningful for

            type:"wallet" refs. Not used by ConnectorResolver (which resolves the

            address from the wallet DB record); exists for frontend round-trip fidelity.'
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.Comment:
      properties:
        createdAt:
          type: string
        createdBy:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.StickyNoteUser'
        id:
          type: string
        nodeId:
          type: string
        position:
          $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.NodePosition'
        replies:
          items:
            $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.CommentReply'
          type: array
          uniqueItems: false
        resolved:
          type: boolean
        text:
          type: string
        updatedAt:
          type: string
      type: object
    github_com_b3-fun_b3-mono_services_b3os-workflow_internal_pkg_entity.Tag:
      properties:
        categories:
          description: e.g., ["blockchain", "finance"]
          items:
            type: string
          type: array
          uniqueItems: false
        count:
          description: 'Scope-dependent: template, action, trigger, or connector count'
          type: integer
        createdAt:
          type: string
        description:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        name:
          type: string
        promotedTemplateCount:
          type: integer
        publicTemplateCount:
          type: integer
        slug:
          type: string
        updatedAt:
          type: string
        weight:
