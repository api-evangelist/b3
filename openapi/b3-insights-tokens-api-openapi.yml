                              type: number
                              description: The market cap of the token in USD
                            circulating_supply:
                              type: number
                              description: The circulating supply of the token
                            total_supply:
                              type: number
                              description: The total supply of the token
                            percent_change_24h:
                              type: number
                              description: The percentage change of the token in the last 24 hours
                            price_timestamp:
                              type: string
                              description: The timestamp of the latest price update
                      required:
                      - block_number
                      - block_timestamp
                      - transaction_hash
                      - from_address
                      - to_address
                      - log_index
                      - contract_address
                      - transfer_type
                      - token_type
                      - amount
                      - chain_id
                  aggregations: {}
                  meta:
                    type: object
                    properties:
                      chain_id:
                        type: number
                      address:
                        type: string
                      signature:
                        type: string
                      page:
                        type: number
                      limit:
                        type: number
                      total_items:
                        type: number
                      total_pages:
                        type: number
                    required:
                    - chain_id
                required:
