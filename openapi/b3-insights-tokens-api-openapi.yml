                          - erc20
                        amount:
                          type: string
                        chain_id:
                          type: number
                        token_metadata:
                          type: object
                          properties:
                            name:
                              type: string
                            symbol:
                              type: string
                            decimals:
                              type: number
                            price_data:
                              type: object
                              properties:
                                price_usd:
                                  type: number
                                  description: The price of the token in USD
                                usd_value:
                                  type: number
                                  description: The value of the token balance in USD
                                volume_24h_usd:
