          example:
          - ETH
          - USDC
        required: true
        name: symbol
        in: query
      - name: chain
        in: query
        required: false
        deprecated: true
        description: Use chain_id instead
        schema:
          type: array
          example:
          - 20
          - 56
          - 1
          items:
            type: number
      - name: chain_id
        in: query
        required: false
        description: The chain ID(s) to request the data for. You can specify multiple chain IDs, up to a maximum of 55. Use repeated query parameters, e.g., `?chain_id=20&chain_id=56`. Optional, because a single chain can as well be specified as a subdomain
        schema:
          type: array
          example:
          - 20
          - 56
          - 1
          items:
            type: number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        chain_id:
                          type: number
                          description: The chain ID of a relevant entry
                          example: 1
                        token_address:
                          type: string
                          title: address (hex or ENS)
                          example: vitalik.eth
                        name:
                          type: string
                        symbol:
                          type: string
                        decimals:
                          type: number
                        price_data:
                          type: object
                          properties:
                            price_usd:
                              type: number
                              description: The price of the token in USD
                            usd_value:
                              type: number
                              description: The value of the token balance in USD
                            volume_24h_usd:
                              type: number
                              description: The volume of the token in USD
                            market_cap_usd:
                              type: number
                              description: The market cap of the token in USD
                            circulating_supply:
                              type: number
                              description: The circulating supply of the token
                            total_supply:
                              type: number
                              description: The total supply of the token
                            percent_change_24h:
                              type: number
                              description: The percentage change of the token in the last 24 hours
                            price_timestamp:
                              type: string
                              description: The timestamp of the latest price update
                      required:
                      - chain_id
                      - token_address
                required:
                - data
        '400':
          description: Bad request
        '500':
          description: Internal server error
components:
  parameters:
    transactionHash:
      schema:
        type: string
      required: true
      name: transaction_hash
      in: path
    page:
      schema:
        type:
        - integer
        - 'null'
        minimum: 0
        default: 0
        description: 'Page number (0-indexed). Maximum value depends on query parameters: 20 for regular queries, 500 when using aggregate or group_by parameters.'
        example: 0
      required: false
      name: page
      in: query
    timestamp:
      schema:
        type: integer
        description: Timestamp in seconds or milliseconds
        exclusiveMinimum: 0
      required: false
      name: timestamp
      in: query
    blockTimestampTo:
      schema:
        type: integer
        description: Filter by block timestamp less than or equal to
        example: 1749768884
        exclusiveMinimum: 0
      required: false
      name: block_timestamp_to
      in: query
    blockNumberTo:
      schema:
        anyOf:
        - type: number
          title: number
        - type: string
          pattern: ^\d+$
          title: string
        description: Filter by block number less than or equal to
        example: '1000000'
      required: false
      name: block_number_to
      in: query
    contractAddress:
      schema:
        type: string
        title: address (hex or ENS)
        example: vitalik.eth
      required: true
      name: contract_address
      in: path
    ownerAddress:
      schema:
        type: string
        title: address (hex or ENS)
        example: vitalik.eth
      required: true
      name: ownerAddress
      in: path
    blockTimestampFrom:
      schema:
        type: integer
        description: Filter by block timestamp greater than or equal to
        example: 1749768884
        exclusiveMinimum: 0
      required: false
      name: block_timestamp_from
      in: query
    limit:
      schema:
        type: integer
        maximum: 1000
        default: 20
        description: The number of items to return
        example: 20
        exclusiveMinimum: 0
      required: false
      name: limit
      in: query
    blockNumberFrom:
      schema:
        anyOf:
        - type: number
          title: number
        - type: string
          pattern: ^\d+$
          title: string
        description: Filter by block number greater than or equal to
        example: '1000000'
      required: false
      name: block_number_from
      in: query
  securitySchemes:
    clientId:
      type: apiKey
      in: header
      name: x-client-id
      description: thirdweb client ID in headers
    secretKey:
      type: apiKey
      in: header
      name: x-secret-key
      description: thirdweb secret key in headers
    dashboard:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: thirdweb JWT + Client ID
    clientId-query:
      type: apiKey
      in: query
      name: clientId
      description: thirdweb client ID in query params
