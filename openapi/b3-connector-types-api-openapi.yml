openapi: 3.2.0
info:
  title: B3 Connector Types API
  version: '1.0'
  description: 'Operations tagged Connector Types across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Connector Types
paths:
  /v1/connector-types:
    get:
      description: List all available connector types
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConnectorTypesSuccessResponse'
          description: OK
      tags:
      - Connector Types
      summary: Get connector types
      x-summary-source: derived
      operationId: getV1ConnectorTypes
      x-operation-id-source: derived
  /v1/connector-types/{type}:
    get:
      description: Get a connector type definition by type
      parameters:
      - description: Connector type
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConnectorTypeSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Connector Types
      summary: Get connector types by type
      x-summary-source: derived
      operationId: getV1ConnectorTypesByType
      x-operation-id-source: derived
