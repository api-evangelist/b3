      tags:
      - Organizations
      summary: Create organizations by org id stripe subscriptions upgrade
      x-summary-source: derived
      operationId: postV1OrganizationsByOrgIdStripeSubscriptionsUpgrade
      x-operation-id-source: derived
  /v1/organizations/{orgId}/auto-swap-settings:
    get:
      description: Get automatic token swap settings for an organization. Returns a disabled default if not yet configured.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  code:
                    type: integer
                  data: {}
                  message:
                    type: string
                  requestId:
                    type: string
                type: object
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal Server Error
      tags:
      - Organizations
      summary: Get organizations by org id auto swap settings
      x-summary-source: derived
      operationId: getV1OrganizationsByOrgIdAutoSwapSettings
      x-operation-id-source: derived
    put:
      description: Update automatic token swap settings for an organization. Owners only.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/UpdateAutoSwapSettingsParams'
                summary: body
                description: Auto-swap settings
        description: Auto-swap settings
