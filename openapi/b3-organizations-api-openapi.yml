openapi: 3.2.0
info:
  title: B3 Organizations API
  version: '1.0'
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Organizations
paths:
  /v1/organizations:
    get:
      description: List all organizations for the current user
      parameters:
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Get organizations
      x-summary-source: derived
      operationId: getV1Organizations
      x-operation-id-source: derived
  /organizations/{orgId}/webhook-secret:
    get:
      description: Get the organization's webhook secret for triggering workflows via integration webhooks
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  code:
                    type: integer
                  data: {}
                  message:
                    type: string
                  requestId:
                    type: string
                type: object
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Organizations
      summary: Get organizations by org id webhook secret
      x-summary-source: derived
      operationId: getOrganizationsByOrgIdWebhookSecret
      x-operation-id-source: derived
  /v1/organizations/{orgId}/public:
    get:
      description: 'Retrieve public metadata for an organization (no authentication required)

        This endpoint is used for organization detail pages'
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  code:
                    type: integer
                  data: {}
                  message:
                    type: string
                  requestId:
                    type: string
                type: object
          description: Organization public metadata
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Organization not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Internal server error
      summary: Get public organization metadata
      tags:
      - Organizations
      operationId: getV1OrganizationsByOrgIdPublic
      x-operation-id-source: derived
  /v1/organizations/{orgId}/caddie-memory:
    delete:
      description: Delete ALL memories Caddie holds about the calling user in this organization. The user's enable toggle is preserved.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearCaddieMemorySuccessResponse'
          description: OK
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Service Unavailable
      tags:
      - Organizations
      summary: Delete organizations by org id caddie memory
      x-summary-source: derived
      operationId: deleteV1OrganizationsByOrgIdCaddieMemory
      x-operation-id-source: derived
    get:
      description: List a page of what Caddie remembers about the calling user in this organization (newest first), plus the user's memory enable toggle. Identity is taken from the authenticated session — a user can only see their own memories.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCaddieMemorySuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Service Unavailable
      tags:
      - Organizations
      summary: Get organizations by org id caddie memory
      x-summary-source: derived
      operationId: getV1OrganizationsByOrgIdCaddieMemory
      x-operation-id-source: derived
  /v1/organizations/{orgId}/caddie-memory/org-settings:
    put:
      description: Enable or disable Caddie's long-term memory for this organization (admin-only). Memory is disabled by default; while disabled, Caddie does not recall, learn, or store facts for any member of the org.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/UpdateCaddieMemoryOrgSettingsParams'
                summary: request
                description: Toggle state
        description: Toggle state
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCaddieMemoryOrgSettingsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Service Unavailable
      tags:
      - Organizations
      summary: Replace organizations by org id caddie memory org settings
      x-summary-source: derived
      operationId: putV1OrganizationsByOrgIdCaddieMemoryOrgSettings
      x-operation-id-source: derived
  /v1/organizations/{orgId}/caddie-memory/settings:
    put:
      description: Enable or disable Caddie's memory of the calling user in this organization. When disabled, Caddie stops recalling, learning, and storing facts about the user.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/UpdateCaddieMemorySettingsParams'
                summary: request
                description: Toggle state
        description: Toggle state
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCaddieMemorySettingsSuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Service Unavailable
      tags:
      - Organizations
      summary: Replace organizations by org id caddie memory settings
      x-summary-source: derived
      operationId: putV1OrganizationsByOrgIdCaddieMemorySettings
      x-operation-id-source: derived
  /v1/organizations/{orgId}/caddie-memory/{scope}/{key}:
    delete:
      description: Delete one memory Caddie holds about the calling user in this organization.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Memory scope (profile or notes)
        in: path
        name: scope
        required: true
        schema:
          type: string
      - description: Memory key
        in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Service Unavailable
      tags:
      - Organizations
      summary: Delete organizations by org id caddie memory by scope by key
      x-summary-source: derived
      operationId: deleteV1OrganizationsByOrgIdCaddieMemoryByScopeByKey
      x-operation-id-source: derived
    put:
      description: Edit the text of one memory Caddie holds about the calling user in this organization. Update-only — unknown keys return 404.
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Memory scope (profile or notes)
        in: path
        name: scope
        required: true
        schema:
          type: string
      - description: Memory key
        in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/UpdateCaddieMemoryParams'
                summary: request
                description: New memory text
        description: New memory text
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.SuccessResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Service Unavailable
      tags:
      - Organizations
      summary: Replace organizations by org id caddie memory by scope by key
      x-summary-source: derived
      operationId: putV1OrganizationsByOrgIdCaddieMemoryByScopeByKey
      x-operation-id-source: derived
  /v1/organizations/{orgId}/database/query:
    post:
      description: Execute SQL query against org's database
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/ExecuteQueryParams'
                summary: request
                description: SQL query and parameters
        description: SQL query and parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Create organizations by org id database query
      x-summary-source: derived
      operationId: postV1OrganizationsByOrgIdDatabaseQuery
      x-operation-id-source: derived
  /v1/organizations/{orgId}/database/tables:
    get:
      description: List all tables in the org's database
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  tables:
                    items:
                      $ref: '#/components/schemas/TableInfo'
                    type: array
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Get organizations by org id database tables
      x-summary-source: derived
      operationId: getV1OrganizationsByOrgIdDatabaseTables
      x-operation-id-source: derived
  /v1/organizations/{orgId}/database/tables/{tableName}:
    get:
      description: Get table schema (columns) from the org's database
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Table name
        in: path
        name: tableName
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  columns:
                    items:
                      $ref: '#/components/schemas/ColumnInfo'
                    type: array
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Organizations
      summary: Get organizations by org id database tables by table name
      x-summary-source: derived
      operationId: getV1OrganizationsByOrgIdDatabaseTablesByTableName
      x-operation-id-source: derived
  /v1/organizations/{orgId}/plan-options:
    get:
      description: Returns all possible plan transitions with pre-calculated pricing
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlanOptionsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Get organizations by org id plan options
      x-summary-source: derived
      operationId: getV1OrganizationsByOrgIdPlanOptions
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/billing-details:
    get:
      description: Return Stripe payment methods and invoices for an organization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStripeBillingDetailsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Get organizations by org id stripe billing details
      x-summary-source: derived
      operationId: getV1OrganizationsByOrgIdStripeBillingDetails
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/checkout-sessions:
    post:
      description: Create a Stripe Checkout Session
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/CreateCheckoutSessionParams'
                summary: body
                description: Checkout session parameters
        description: Checkout session parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutSessionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Create organizations by org id stripe checkout sessions
      x-summary-source: derived
      operationId: postV1OrganizationsByOrgIdStripeCheckoutSessions
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/payment-methods/{pmId}:
    delete:
      description: Detach a payment method from the organization's Stripe customer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Delete organizations by org id stripe payment methods by pm id
      x-summary-source: derived
      operationId: deleteV1OrganizationsByOrgIdStripePaymentMethodsByPmId
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/setup-intents:
    post:
      description: Create a Stripe SetupIntent for collecting a new payment method
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSetupIntentResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Create organizations by org id stripe setup intents
      x-summary-source: derived
      operationId: postV1OrganizationsByOrgIdStripeSetupIntents
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/subscriptions/downgrade:
    post:
      description: Downgrade a Stripe subscription (or cancel to free)
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/DowngradeStripeSubscriptionParams'
                summary: body
                description: Downgrade parameters
        description: Downgrade parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowngradeStripeSubscriptionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Create organizations by org id stripe subscriptions downgrade
      x-summary-source: derived
      operationId: postV1OrganizationsByOrgIdStripeSubscriptionsDowngrade
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/subscriptions/preview-upgrade:
    get:
      description: Returns pro-rated amounts for all upgrade-eligible tier+interval combos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewUpgradeResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      summary: Preview pro-rated upgrade pricing
      tags:
      - Organizations
      operationId: getV1OrganizationsByOrgIdStripeSubscriptionsPreviewUpgrade
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/subscriptions/reactivate:
    post:
      description: Reactivate a subscription with pending cancellation
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactivateSubscriptionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Bad Request
      tags:
      - Organizations
      summary: Create organizations by org id stripe subscriptions reactivate
      x-summary-source: derived
      operationId: postV1OrganizationsByOrgIdStripeSubscriptionsReactivate
      x-operation-id-source: derived
  /v1/organizations/{orgId}/stripe/subscriptions/upgrade:
    post:
      description: Upgrade a Stripe subscription
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/UpgradeStripeSubscriptionParams'
                summary: body
                description: Upgrade parameters
        description: Upgrade parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeStripeSubscriptionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
