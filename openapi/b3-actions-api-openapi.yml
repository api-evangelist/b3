openapi: 3.2.0
info:
  title: B3 Actions API
  version: '1.0'
  description: 'Operations tagged Actions across 2 of this provider''s published API definitions: b3-b3os-workflow-openapi.json, b3-b3os-workflow-openapi_2.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Actions
paths:
  /v1/actions/{type}:
    get:
      description: Get an action definition by type
      parameters:
      - description: Action type
        in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActionSuccessResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_b3-fun_b3-mono_services_b3os-workflow_internal_app_api_http.ErrorResponse'
          description: Not Found
      tags:
      - Actions
      summary: Get actions by type
      x-summary-source: derived
      operationId: getV1ActionsByType
      x-operation-id-source: derived
  /v1/actions:
    get:
      description: List all available actions, optionally filtered by tags
      parameters:
      - description: Filter by tags (comma-separated or multiple params). Actions must have ALL specified tags (AND logic).
        in: query
        name: tags
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListActionsSuccessResponse'
          description: OK
      tags:
      - Actions
      summary: Get actions
      x-summary-source: derived
      operationId: getV1Actions
      x-operation-id-source: derived
