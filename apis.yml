    url: openapi/b3-b3os-workflow-openapi.json
  - type: Overlay
    url: overlays/b3-b3os-workflow-overlay.yaml
- name: B3 Data API
  description: >-
    Free public REST API for indexed B3-ecosystem blockchain data — transactions, blocks,
    tokens, NFTs, contracts and stats via Blockscout explorers plus Thirdweb Insights, with
    intelligent multi-chain routing. No authentication required for public endpoints.
  humanURL: https://docs.b3.fun/data/api-reference/introduction
  baseURL: https://data-api.b3.fun
  tags:
  - Onchain Data
  - Web3
  properties:
  - type: OpenAPI
