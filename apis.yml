aid: b3
name: B3
description: >-
  B3 is an onchain economy platform founded by former Coinbase leaders, operating an
  EVM-equivalent Layer-3 gaming and payments chain settling to Base. B3 ships across three
  engines: Labs (products such as Basement/Bsmnt, HypeDuel, AnySpend, XCade and B3AR),
  B3OS (a credit-based, no-code automation platform for cross-chain workflows), and Holdings
  (strategic investments). For developers B3 exposes the B3OS Workflow API (workflows,
  triggers, actions, runs, connectors, outbound webhooks and an x402 payment surface), a
  free public B3 Data API (Blockscout + Thirdweb Insights indexed onchain data), a Profiles
  API for aggregated onchain identity, and Global Accounts SDKs. B3 was surfaced as a
  portfolio company of Pantera Capital and enriched into the API Evangelist network.
