apis:
- name: B3OS Workflow API
  description: >-
    Workflow-management API for B3OS — create and run multi-step cross-chain automations
    from triggers, actions, connectors and templates, with outbound webhooks (delivery
    tracking, replay, retry), API keys, and an x402 payment-required (Compute Unit) surface.
  humanURL: https://docs.b3.fun/data/api-reference/index
  baseURL: https://api.b3os.org/v1
  tags:
  - Workflow Automation
  - Web3
  properties:
